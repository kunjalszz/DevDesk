services:
  postgres:
    image: postgres:17
    container_name: devdesk-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: devdesk
      POSTGRES_PASSWORD: devdesk_password
      POSTGRES_DB: devdesk
    ports:
      - "5432:5432"
    volumes:
      - devdesk_postgres_data:/var/lib/postgresql/data

volumes:
  devdesk_postgres_data:
